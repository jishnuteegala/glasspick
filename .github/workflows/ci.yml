name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@v1
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      post-check: |
        SOURCE_DATE_EPOCH=315532800 python -X utf8 scripts/package_release.py snapshot
        (cd artifact && sha256sum --check SHA256SUMS)

  corepack:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@c3fe7b2f4aad5283e67c556400180380f5889e23
    with:
      os: '["windows-latest"]'

  standalone:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@1480a79633b00b671a718c48e6e20c117554cd7a
    with:
      os: '["windows-latest"]'
