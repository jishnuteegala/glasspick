name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@v1
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      post-check: |
        SOURCE_DATE_EPOCH=315532800 python -X utf8 scripts/package_release.py snapshot
        (cd artifact && sha256sum --check SHA256SUMS)
