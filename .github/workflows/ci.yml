name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@d81f20346fa6ec12b38ee0eb83bd22c7dd8e2895
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      post-check: |
        SOURCE_DATE_EPOCH=315532800 python -X utf8 scripts/package_release.py snapshot
        (cd artifact && sha256sum --check SHA256SUMS)

  baseline:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@v1
    with:
      os: '["windows-latest"]'
